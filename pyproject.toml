[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-revkit"
dynamic = ["version"]
description = "Universal static reverse-engineering triage tool for binaries, scripts, archives and documents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nullpath Security" }]
requires-python = ">=3.9"
keywords = ["reverse-engineering", "malware-analysis", "static-analysis", "triage", "ctf", "pe", "elf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "capstone>=5.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
full = [
    "lief>=0.14",
    "pyelftools>=0.30",
    "dnfile>=0.14",
    "oletools>=0.60",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
revkit = "revkit:main"

[project.urls]
Homepage = "https://github.com/h050sh/easy-revkit"
Issues = "https://github.com/h050sh/easy-revkit/issues"

[tool.setuptools]
py-modules = ["revkit"]

[tool.setuptools.dynamic]
version = { attr = "revkit.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 160

[tool.ruff.lint]
select = ["F", "E9", "B", "W6"]
ignore = ["B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
